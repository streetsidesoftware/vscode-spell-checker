name: ' 🔗 Update CSpell'

on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
      - '**/package-lock.json'
  workflow_dispatch:
    inputs:
      base:
        description: The Base Ref to apply the diff
        required: false
        default: 'main'
  schedule:
    - cron: '0 12 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEW_BRANCH: "update-cspell-${{ inputs.base || 'main' }}"
  REF_BRANCH: ${{ inputs.base || 'main' }}

jobs:
  update-dependencies:
    if: github.repository_owner == 'streetsidesoftware'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF_BRANCH }}

      - name: Install Node.js
        uses: ./.github/actions/setup-node

      - name: Info
        run: |
          npm -v
          node -v

      - name: Get Current CSpell Version
        id: cspell-current-version
        run: |
          echo "value=$(jq -r '.devDependencies.cspell[1:]' package.json)" >> $GITHUB_OUTPUT

      - name: Get Current CSpell Dictionary Bundle Version
        id: dict-bundle-current-version
        run: |
          echo "value=$(jq -r '.dependencies["@cspell/dict-cspell-bundle"][1:]' package.json)" >> $GITHUB_OUTPUT

      - name: Update
        run: |
          npm i
          npm run update-cspell
          npm i
          npm run build
          npm run build:readme
          npm run lint

      - name: Get New CSpell Version
        id: cspell-new-version
        run: |
          echo "value=$(jq -r '.devDependencies.cspell[1:]' package.json)" >> $GITHUB_OUTPUT

      - name: Get New CSpell Dictionary Bundle Version
        id: dict-bundle-new-version
        run: |
          echo "value=$(jq -r '.dependencies["@cspell/dict-cspell-bundle"][1:]' package.json)" >> $GITHUB_OUTPUT

      - name: Update Info
        id: update-info
        uses: actions/github-script@v9
        env:
          CSPELL_CURRENT: ${{ steps.cspell-current-version.outputs.value }}
          CSPELL_NEW: ${{ steps.cspell-new-version.outputs.value }}
          DICT_CURRENT: ${{ steps.dict-bundle-current-version.outputs.value }}
          DICT_NEW: ${{ steps.dict-bundle-new-version.outputs.value }}
        with:
          result-encoding: string
          script: |
            const cspellCurrent = process.env.CSPELL_CURRENT;
            const cspellNew = process.env.CSPELL_NEW;
            const dictCurrent = process.env.DICT_CURRENT;
            const dictNew = process.env.DICT_NEW;

            const cspellChanged = cspellCurrent !== cspellNew;
            const dictChanged = dictCurrent !== dictNew;

            const curParts = cspellCurrent.split('.').map(Number);
            const newParts = cspellNew.split('.').map(Number);
            const type = (newParts[0] > curParts[0] || newParts[1] > curParts[1]) ? 'feat' : 'fix';

            const cspellSubject = `Update CSpell from \`${cspellCurrent}\` to \`${cspellNew}\``;
            const dictSubject = `Update CSpell Dictionary Bundle from \`${dictCurrent}\` to \`${dictNew}\``;

            let subject;
            if (cspellChanged && dictChanged) {
              subject = `${cspellSubject} and Dictionary Bundle from \`${dictCurrent}\` to \`${dictNew}\``;
            } else if (cspellChanged) {
              subject = cspellSubject;
            } else if (dictChanged) {
              subject = dictSubject;
            } else {
              subject = 'Update CSpell dependencies';
            }

            let description;
            if (cspellChanged && dictChanged) {
              description = `This PR updates the CSpell version from \`${cspellCurrent}\` to \`${cspellNew}\` and the CSpell Dictionary Bundle from \`${dictCurrent}\` to \`${dictNew}\`.`;
            } else if (cspellChanged) {
              description = `This PR updates the CSpell version from \`${cspellCurrent}\` to \`${cspellNew}\`.`;
            } else if (dictChanged) {
              description = `This PR updates the CSpell Dictionary Bundle from \`${dictCurrent}\` to \`${dictNew}\`.`;
            } else {
              description = 'This PR updates the CSpell dependencies.';
            }

            core.setOutput('type', type);
            core.setOutput('subject', subject);
            core.setOutput('description', description);
            core.setOutput('cspell-changed', String(cspellChanged));
            core.setOutput('dict-changed', String(dictChanged));

      - name: Get Available CSpell Releases
        id: cspell-release-tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo value=$(gh release list -R streetsidesoftware/cspell --exclude-drafts --json tagName --jq '.[].tagName') >> $GITHUB_OUTPUT

      - name: Build List of CSpell Releases
        id: cspell-releases
        uses: actions/github-script@v9
        env:
          CURRENT: ${{ steps.cspell-current-version.outputs.value }}
          NEW: ${{ steps.cspell-new-version.outputs.value }}
          RELEASES: ${{ steps.cspell-release-tags.outputs.value }}
        with:
          result-encoding: string
          script: |
            const current = 'v' + process.env.CURRENT;
            const newVersion = 'v' + process.env.NEW;
            const releases = process.env.RELEASES.split(/\s+/).filter(release => release > current && release <= newVersion);
            return releases.map(r => `- [${r}](https://github.com/streetsidesoftware/cspell/releases/tag/${r})`).join('\n') || '- Not Updated';

      - name: GenBody
        id: body
        uses: streetsidesoftware/actions/public/pr-body@v1
        with:
          title: Update ALL Dependencies
          message: |
            ${{ steps.update-info.outputs.description }}

            CSpell Releases:
            ${{ steps.cspell-releases.outputs.result }}

            <!---
            BEGIN_COMMIT_OVERRIDE
            ${{ steps.update-info.outputs.type }}: ${{ steps.update-info.outputs.subject }} and other dependencies
            END_COMMIT_OVERRIDE
            --->
          path: package.json

      - name: PR
        uses: streetsidesoftware/actions/.github/actions/pr@v1
        with:
          commit-message: 'ci: Update CSpell'
          branch: ${{ env.NEW_BRANCH }}
          base: ${{ env.REF_BRANCH }}
          title: >-
            ${{ steps.update-info.outputs.type }}: ${{ steps.update-info.outputs.subject }}
          body: ${{ steps.body.outputs.body }}
          app_id: ${{ secrets.AUTOMATION_APP_ID }}
          app_private_key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
