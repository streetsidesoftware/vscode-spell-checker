name: ' 🧽 Lint Docs'
on: # rebuild any PRs and main branch changes
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lint-docs.yml'
      - 'website/**'
      - 'docs/**'
      - '.claude/**'
      - '.github/copilot-instructions.md'
      - '*.md'

env:
  DOCS: website docs .claude .github/copilot-instructions.md *.md

jobs:
  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npx cspell --dot --no-progress $DOCS

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: ./.github/actions/setup-node

      - run: |
          npm i
          npx prettier -c $DOCS
